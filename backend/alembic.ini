# Alembic config for Aureon. The database URL is not set here: migrations/env.py
# uses the same location as the app (AUREON_DB_PATH or the default data dir).
# The app runs `upgrade head` automatically on startup, so you only need the
# CLI when creating a new migration:
#   .venv/Scripts/alembic revision --autogenerate -m "describe change"

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
